# Display settings. Restart ./start.sh after editing.
[display]
zh_scale = 1.0
en_scale = 1.0
# false: show Chinese temporarily, then replace it with English.
show_zh = false

# Language settings. Source accepts auto or a BCP-47 code such as zh-TW.
[languages]
source = "auto"
destination = "en"

# Select an input device by a case-insensitive name fragment.
# "pipewire" is the default on this workstation; examples: "ALC257 Analog", "Stereo Microphone".
[audio]
input_device = "pipewire"
